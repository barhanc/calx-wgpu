<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phlox - WebGPU Demo</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.5rem;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #2563eb;
      }
      button:disabled {
        background: #475569;
        cursor: not-allowed;
      }
      pre {
        background: #090d16;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 1rem;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9rem;
        color: #38bdf8;
      }
      .tag {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-right: 0.5rem;
      }
      .tag-success {
        background: #065f46;
        color: #34d399;
      }
      .tag-warn {
        background: #78350f;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🌺 Phlox WebGPU Demo</h1>
      <p>Test WebGPU device initialization and tensor host-device-host roundtrip.</p>

      <div id="status" style="margin-bottom: 1rem">Checking WebGPU support...</div>

      <button id="run-btn" disabled>Run Tensor Roundtrip</button>

      <pre id="log">Logs will appear here...</pre>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
